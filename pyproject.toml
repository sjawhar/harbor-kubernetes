[project]
name = "harbor-kubernetes"
version = "0.1.0.dev0"
description = "A Kubernetes pod environment for Harbor trials"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Sami Jawhar" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Harbor is not a hard dependency: the package is only ever loaded by a process that already
# runs Harbor (`harbor run`, or a host that runs Harbor in-process), and Harbor's litellm caps
# openai<3, which a hard dependency would force on every environment that installs this
# package. Install it beside Harbor, or take the `harbor` extra.
dependencies = [
    "kubernetes>=29.0.0,<36",
    "pydantic>=2.12.0",
]

[project.optional-dependencies]
harbor = [
    "harbor>=0.23.0,<0.25",
]

[project.urls]
Repository = "https://github.com/sjawhar/harbor-kubernetes"
Issues = "https://github.com/sjawhar/harbor-kubernetes/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harbor_kubernetes"]

[dependency-groups]
dev = [
    "basedpyright",
    "harbor>=0.23.0,<0.25",
    "pytest",
    "pytest-asyncio",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.5",
]

[tool.pyright]
typeCheckingMode = "basic"
reportAny = false
reportExplicitAny = false
reportMissingModuleSource = false
reportMissingTypeStubs = false
reportUnusedCallResult = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = ["--basetemp=.pytest-tmp"]
testpaths = ["tests"]

[tool.ruff]
format.exclude = ["*.md"]
lint.select = ["E4", "E7", "E9", "F"]
lint.extend-select = ["ANN0", "ANN2", "B006", "BLE001", "E701", "E702", "FA102", "FURB", "I"]
lint.pydocstyle.convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["ANN0", "ANN2"]
"**/test_*.py" = ["ANN0", "ANN2"]
"**/conftest.py" = ["ANN0", "ANN2"]
