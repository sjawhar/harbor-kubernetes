name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  unit:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        harbor: ["0.23.0", "0.24.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          uv sync --group dev
          uv pip install "harbor==${{ matrix.harbor }}"
      # --no-sync: a syncing `uv run` would reinstall the locked Harbor over the matrix's.
      - name: Harbor under test
        run: |
          installed=$(uv run --no-sync python -c 'import importlib.metadata as m; print(m.version("harbor"))')
          echo "harbor $installed"
          test "$installed" = "${{ matrix.harbor }}"
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync basedpyright
      - run: uv run --no-sync pytest -n 4 -q
